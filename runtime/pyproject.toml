[project]
name = "dsh-voice-runtime"
version = "0.1.0"
description = "Local-first voice runtime for DSH Voice Assistant"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "DSH Voice Assistant contributors" }]
dependencies = [
    "numpy>=1.26,<3",
    "platformdirs>=4.3,<5",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "scipy>=1.14,<2",
    "websockets>=14,<16",
]

[project.scripts]
voice-runtime = "voice_runtime.daemon:cli"

[project.optional-dependencies]
full = [
    "sounddevice>=0.5,<1",
    "soundfile>=0.12,<1",
    "livekit>=1.2,<2",
    "sherpa-onnx>=1.10.45,<2",
    "onnxruntime>=1.22,<2",
]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
